services:
  prometheus:
    image: prom/prometheus:latest
    container_name: network-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - ./monitoring/prometheus/targets:/etc/prometheus/targets:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: network-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    restart: unless-stopped
  snmp-exporter:
      image: prom/snmp-exporter:latest
      container_name: network-snmp-exporter
      ports:
        - "9116:9116"
      volumes:
        - ./monitoring/snmp-exporter/snmp.yml:/etc/snmp_exporter/snmp.yml:ro
      command:
        - "--config.file=/etc/snmp_exporter/snmp.yml"
      restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    container_name: network-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    extra_hosts:
      - "alert-gateway:host-gateway"
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
volumes:
  prometheus-data:
  grafana-data:
